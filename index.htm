<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ContactHub - Smart Contact Manager</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="stely.css/stely.css">
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="header">
    <div class="brand">
      <div class="brand-logo"><i class="fa-solid fa-address-book"></i></div>
      <div>
        <h1>Contact<span>Hub</span></h1>
        <p>Smart Contact Manager</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" id="addBtn"><i class="fa-solid fa-plus"></i> Add Contact</button>
      <button class="icon-btn" aria-label="Notifications"><i class="fa-solid fa-bell"></i></button>
      <button class="icon-btn" aria-label="Settings"><i class="fa-solid fa-gear"></i></button>
      <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
    </div>
  </header>

  <main class="container">

    <!-- ===== Stats ===== -->
    <section class="stats">
      <div class="stat">
        <div class="stat-icon blue"><i class="fa-solid fa-user-group"></i></div>
        <div><span class="stat-label">Total</span><strong id="totalCount">0</strong></div>
      </div>
      <div class="stat">
        <div class="stat-icon orange"><i class="fa-solid fa-star"></i></div>
        <div><span class="stat-label">Favorites</span><strong id="favCount">0</strong></div>
      </div>
      <div class="stat">
        <div class="stat-icon red"><i class="fa-solid fa-heart-pulse"></i></div>
        <div><span class="stat-label">Emergency</span><strong id="emergencyCount">0</strong></div>
      </div>
    </section>

    <!-- ===== Contacts ===== -->
    <section class="contacts-head">
      <h2>All Contacts</h2>
      <p id="subtitle">Manage and organize your 0 contacts</p>
    </section>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="search" id="searchInput" placeholder="Search by name, phone, or email...">
    </div>

    <div id="contactsList" class="contacts-grid"></div>

    <div id="emptyState" class="empty-state">
      <i class="fa-solid fa-address-book"></i>
      <p>No contacts found</p>
    </div>

    <!-- ===== Favorites ===== -->
    <section class="side-panel">
      <div class="panel-head fav-head">
        <div class="stat-icon orange"><i class="fa-solid fa-star"></i></div>
        <div><h3>Favorites</h3><p>Quick access</p></div>
      </div>
      <div class="panel-body">
        <div id="favList" class="panel-list"></div>
        <p class="panel-empty" id="favEmpty">No favorites yet</p>
      </div>
    </section>

    <!-- ===== Emergency ===== -->
    <section class="side-panel">
      <div class="panel-head emg-head">
        <div class="stat-icon red"><i class="fa-solid fa-heart-pulse"></i></div>
        <div><h3>Emergency</h3><p>Urgent contacts</p></div>
      </div>
      <div class="panel-body">
        <div id="emergencyList" class="panel-list"></div>
        <p class="panel-empty" id="emergencyEmpty">No emergency contacts</p>
      </div>
    </section>
  </main>

  <!-- ===== Modal ===== -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modalTitle">Add New Contact</h3>
        <button class="close-btn" id="closeModal" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="contactForm" novalidate>
        <div class="modal-body">

          <div class="photo-area">
            <div class="photo-circle" id="photoPreview"><i class="fa-solid fa-user"></i></div>
            <label class="btn btn-soft" for="photoInput"><i class="fa-solid fa-camera"></i> Change Photo</label>
            <input type="file" id="photoInput" accept="image/*" hidden>
          </div>

          <div class="field">
            <label for="fullName">Full Name <b>*</b></label>
            <input type="text" id="fullName" placeholder="Enter full name">
            <small class="error" id="nameError"></small>
          </div>

          <div class="field">
            <label for="phone">Phone Number <b>*</b></label>
            <input type="tel" id="phone" placeholder="e.g., 01012345678">
            <small class="error" id="phoneError"></small>
          </div>

          <div class="field">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="name@example.com">
            <small class="error" id="emailError"></small>
          </div>

          <div class="field">
            <label for="address">Address</label>
            <input type="text" id="address" placeholder="Enter address">
          </div>

          <div class="field">
            <label for="group">Group</label>
            <select id="group">
              <option value="">Select a group</option>
              <option value="family">Family</option>
              <option value="friends">Friends</option>
              <option value="work">Work</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="field">
            <label for="notes">Notes</label>
            <textarea id="notes" rows="3" placeholder="Add notes about this contact"></textarea>
          </div>

          <div class="checks">
            <label><input type="checkbox" id="isFavorite"> <i class="fa-solid fa-star star"></i> Favorite</label>
            <label><input type="checkbox" id="isEmergency"> <i class="fa-solid fa-heart-pulse pulse"></i> Emergency</label>
          </div>
        </div>

        <div class="modal-foot">
          <button type="button" class="btn btn-soft" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn"><i class="fa-solid fa-check"></i> Save Contact</button>
        </div>
      </form>
    </div>
  </div>

 
<script src="main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
</body>
</html>
